# Replace __DOMAIN__ during setup-vps.sh (e.g. crownevcenter.com)
# default_server so http://YOUR_VPS_IP works before DNS is pointed
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;

    client_max_body_size 10M;

    root /var/www/crownev/frontend/dist;
    index index.html;

    # Hashed build assets — long cache (filename changes each deploy)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA shell — never cache (prevents stale chunk references after deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # React SPA (non-file routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — cache headers set by Express per route
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded images / files
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health (monitoring)
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
