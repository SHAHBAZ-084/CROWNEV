# Auto-deploy to Hostinger VPS when you push to main.
# Primary path: poll-deploy cron on the VPS (every 3 min). This job is a fast SSH attempt only.
# Requires GitHub secret: VPS_SSH_KEY (see deploy/activate-cicd.ps1)
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS_HOST: 62.72.58.96
  VPS_USER: root
  VPS_PORT: "22"

jobs:
  deploy:
    name: Deploy to crownevcenter.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check deploy key secret
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_SSH_KEY. Run deploy/activate-cicd.ps1 once on your PC."
            exit 1
          fi

      - name: Deploy over SSH (single fast attempt)
        id: ssh_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          timeout: 45s
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            export RUN_PARTS_SEED=0
            export RUN_DB_SEED=0
            bash /var/www/crownev/deploy/deploy-app.sh

      - name: Deploy result
        run: |
          if [ "${{ steps.ssh_deploy.outcome }}" = "success" ]; then
            echo "Deployed via GitHub Actions SSH."
            exit 0
          fi
          echo "::notice::GitHub could not SSH to the VPS (Hostinger often blocks GitHub runner IPs)."
          echo "::notice::Poll-deploy on the VPS deploys within about 3 minutes after every push."
          echo "Site: https://crownevcenter.com"
          exit 0
