# Auto-deploy to Hostinger VPS when you push to main.
# One-time setup: add GitHub repo secrets (see DEPLOY.md → Auto-deploy).
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to crownevcenter.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_PARTS_SEED: "0"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            export RUN_PARTS_SEED=0
            export RUN_DB_SEED=1
            bash /var/www/crownev/deploy/deploy-app.sh
