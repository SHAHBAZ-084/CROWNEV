# Auto-deploy to Hostinger VPS when you push to main.
# Requires GitHub secret: VPS_SSH_KEY (private deploy key — see deploy/activate-cicd.ps1)
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VPS_HOST: 62.72.58.96
  VPS_USER: root
  VPS_PORT: "22"

jobs:
  deploy:
    name: Deploy to crownevcenter.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check deploy key secret
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Missing GitHub secret VPS_SSH_KEY. Run deploy/activate-cicd.ps1 once on your PC."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            export RUN_PARTS_SEED=0
            export RUN_DB_SEED=1
            bash /var/www/crownev/deploy/deploy-app.sh
